<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Creator Circle | Flexbox vs Grid</title>

    <!-- this adds basic colors and spacing to the page -->
    <style>
        :root {
            --color-dark: #0b2545;
            --color-mint: #8fe3c0;
            --color-sidebar: #dff7ec;
            --color-main: #fafffc;
            --color-light: #ffffff;
            --space: clamp(1rem, 0.6rem + 1.5vw, 2rem);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(1rem, 0.9rem + 0.35vw, 1.25rem);
            line-height: 1.6;
            color: var(--color-dark);
            background: var(--color-sidebar);
        }

        h1,
        h2,
        h3,
        h4 {
            margin-top: 0;
        }

        header,
        nav,
        aside,
        main,
        footer {
            padding: var(--space);
        }

        a {
            color: var(--color-dark);
        }

        .header,
        .footer {
            background: var(--color-dark);
            color: var(--color-light);
            text-align: center;
        }

        .header h1 {
            color: var(--color-mint);
        }

        .nav {
            background: var(--color-mint);
        }

        .main {
            background: var(--color-main);
        }

        .sidebar {
            background: var(--color-sidebar);
        }

        .nav__list {
            display: flex;
            justify-content: center;
            gap: var(--space);
            margin: 0;
            padding: 0;
            list-style: none;
        }
    </style>

    <!-- remove one of the comment tags here to try out flexbox or grid -->
    <!-- <link rel="stylesheet" href="flexbox-style.css"> -->
    <link rel="stylesheet" href="grid-style.css">

</head>

<body>

    <div class="page">
        <header class="header">
            <h1>Creator Circle</h1>
            <p>Where content creators meet, collaborate, and grow together.</p>
        </header>

        <nav class="nav">
            <ul class="nav__list">
                <li><a href="#">Home</a></li>
                <li><a href="#">Events</a></li>
                <li><a href="#">Members</a></li>
            </ul>
        </nav>

        <div class="content">
            <main class="main">
                <h2>Welcome to the Circle</h2>
                <p>Main content area taking up 70% on desktop.</p>
            </main>

            <aside class="sidebar">
                <h2>Upcoming Events</h2>
                <p>Sidebar area taking up 30% on desktop.</p>
            </aside>
        </div>

        <footer class="footer">
            <p>&copy; 2026 Creator Circle. AdvFrontend Group 4.</p>
        </footer>
    </div>

</body>

</html>
